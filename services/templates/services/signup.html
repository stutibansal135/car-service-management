{% extends 'services/public_base.html' %}
{% block title %}Sign up{% endblock %}
{% block body %}
<section class="mx-auto max-w-lg px-6 py-12">
  <h1 class="mb-1 text-3xl font-bold text-navy">Create your account</h1>
  <p class="mb-6 text-sm text-slate-500">Already registered? <a href="{% url 'login' %}" class="font-semibold text-navy hover:text-gold">Log in</a></p>
  <form method="post" class="space-y-4 rounded-xl border border-slate-200 bg-white p-6">{% csrf_token %}
    {% for field in form %}<div>
      <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">{{ field.label }}{% if field.field.required %}<span class="text-rose-500"> *</span>{% endif %}</label>
      {{ field }}{% for e in field.errors %}<p class="mt-1 text-xs text-rose-600">{{ e }}</p>{% endfor %}
    </div>{% endfor %}
    <button class="w-full rounded-lg bg-navy py-2.5 text-sm font-semibold text-gold hover:bg-navy-light">Sign up</button>
  </form>
</section>
{% endblock %}
