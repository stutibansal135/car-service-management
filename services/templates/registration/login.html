<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CSM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#101827',light:'#1c2a40'},gold:'#d6ad60',cream:'#f7f5f0'}}}}</script>
</head>
<body class="flex min-h-screen items-center justify-center bg-navy px-4 py-8">
  <div class="w-full max-w-sm space-y-4">
  <form method="post" class="space-y-4 rounded-2xl bg-white p-8 shadow-xl">
    {% csrf_token %}
    <div class="text-center">
      <div class="text-3xl font-extrabold tracking-widest text-navy">CS<span class="text-gold">M</span></div>
      <p class="mt-1 text-sm text-slate-500">Car Service Management</p>
    </div>
    {% if form.errors %}<p class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700">Wrong username or password.</p>{% endif %}
    {% for m in messages %}<p class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ m }}</p>{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <div><label class="mb-1 block text-sm font-medium">Username</label>
      <input name="username" autofocus required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-gold focus:outline-none"></div>
    <div><label class="mb-1 block text-sm font-medium">Password</label>
      <input type="password" name="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-gold focus:outline-none"></div>
    <button class="w-full rounded-lg bg-navy py-2.5 text-sm font-semibold text-gold hover:bg-navy-light">Sign in</button>
    <p class="text-center text-xs text-slate-500">New customer? <a href="{% url 'signup' %}" class="font-semibold text-navy hover:text-gold">Create an account</a></p>
    <a href="{% url 'home' %}" class="block text-center text-xs text-slate-400 hover:text-navy">&larr; Back to home</a>
  </form>

  </div>
</body></html>
